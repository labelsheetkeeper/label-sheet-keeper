# Runs every check on each push. The live panel (GitHub Pages) and the
# Worker (Cloudflare) are only updated from main, and only after every
# check has passed.
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the test browser
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      # Later steps run even if an earlier one fails, so one run shows every failure.
      - name: Address, CSV, barcode and scan-measuring helpers
        run: node tests/tools-test.js

      - name: Sheets, printing, addresses, table window, shipping labels
        if: ${{ !cancelled() }}
        run: python tests/e2e/run.py

      - name: Stock, fill other sheets first, numbers and codes, scans, backups
        if: ${{ !cancelled() }}
        run: python tests/e2e/run15.py

      - name: Sheet list clean-up, editing addresses, undoing older prints
        if: ${{ !cancelled() }}
        run: python tests/e2e/run16.py

      - name: Alignment squares, recent addresses, groups, labels saved
        if: ${{ !cancelled() }}
        run: python tests/e2e/run17.py

      - name: Sending labels from a phone
        if: ${{ !cancelled() }}
        run: python tests/e2e/run18.py

      - name: Phone, email and second addresses; choosing contacts to import
        if: ${{ !cancelled() }}
        run: python tests/e2e/run19.py

      - name: Address suggestions in the panel's address boxes
        if: ${{ !cancelled() }}
        run: python tests/e2e/run20.py

      - name: Label text where Word puts it, suggestions on labels, print preview
        if: ${{ !cancelled() }}
        run: python tests/e2e/run21.py

      - name: Signing in and sync in the panel, and the sign-in window
        if: ${{ !cancelled() }}
        run: python tests/e2e/run22.py

      - name: Worker request handling
        if: ${{ !cancelled() }}
        run: node tests/worker-test.mjs

      - name: Sync between several computers, through the Worker
        if: ${{ !cancelled() }}
        run: node tests/sync-test.mjs

      - name: Lint
        if: ${{ !cancelled() }}
        run: npx --yes eslint@10.1.0 -c tests/eslint.config.cjs taskpane.js table.js lsk-tools.js sheetdoc.js preview.js lsk-account.js lsk-config.js auth.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Gather the panel files (everything except tests, the Worker and repository files)
        run: |
          mkdir _site
          git archive HEAD -- . ':(exclude)tests' ':(exclude).github' ':(exclude)worker' | tar -x -C _site

      # Each page adds "?t=<LSK_T>" to the files it loads. In the repository LSK_T is
      # the current time, so a developer always gets fresh files. Here it becomes this
      # release's stamp, so browsers can keep the files until the next release.
      - name: Stamp the pages with this release
        run: |
          stamp=$(git rev-parse --short=12 HEAD)
          pages=$(grep -rl --include='*.html' 'LSK_T' _site || true)
          [ -n "$pages" ] || { echo "::error title=Release stamp::No page uses LSK_T any more; update this step."; exit 1; }
          for p in $pages; do
            if ! grep -q 'window.LSK_T = Date.now();' "$p"; then
              echo "::error title=Release stamp::$p uses LSK_T but doesn't have the exact line: window.LSK_T = Date.now();"
              exit 1
            fi
            sed -i "s/window.LSK_T = Date.now();/window.LSK_T = '$stamp';/" "$p"
          done
          echo "::notice title=Release stamp::$stamp on $(echo "$pages" | wc -l) pages"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  worker:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The web address the panel is served from: the only origin the Worker answers
      # browsers from. Keep it the same as PANEL_ORIGINS in worker/wrangler.toml.
      PANEL_ORIGIN: https://labelsheetkeeper.github.io
    concurrency:
      group: worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Problems are repeated as annotations so they can be read without opening the log.
      - name: Deploy the Worker to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4.156.2 deploy 2>&1 | tee deploy.log; then
            grep -iE 'error|✘|authentication|permission|subdomain' deploy.log | tail -8 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error title=Worker deploy::$line"
            done || true
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice title=Worker address::$url"
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: Check the Worker answers
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "$WORKER_URL/health") && break
            sleep 10
          done
          echo "$body"
          if echo "$body" | grep -q '"ok":true'; then
            echo "::notice title=Worker check::$WORKER_URL/health answered: $body"
          else
            echo "::error title=Worker check::No healthy answer from $WORKER_URL/health"
            exit 1
          fi

      # Links a throwaway mailbox, sends a real PDF through the live Worker,
      # reads it back, then unlinks (which deletes everything it made).
      - name: Check sending a label end to end
        run: |
          fail() { echo "::error title=Phone mailbox check::$1"; exit 1; }
          PDF=tests/fixtures/sample-return-label.pdf
          pair=$(curl -fsS -X POST -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/pair") || fail "Linking failed"
          box=$(echo "$pair" | jq -r .box); key=$(echo "$pair" | jq -r .key)
          [ "${#box}" -eq 22 ] || fail "No mailbox in the answer"
          echo "::add-mask::$key"
          # Right after a deploy, some of Cloudflare's machines still run the old
          # version for a few seconds, so a miss is tried again.
          for try in 1 2 3 4; do
            sent=$(curl -sS -X POST --data-binary @"$PDF" -H 'X-File-Name: check.pdf' "$WORKER_URL/drop/$box?reply=text")
            [ "$sent" = "Sent to Label Sheet Keeper." ] && break
            sleep 10
          done
          if [ "$sent" != "Sent to Label Sheet Keeper." ]; then
            probe=$(curl -sS -w ' [%{http_code}]' "$WORKER_URL/drop/$box")
            fail "Sending to /drop/$box answered: $sent. A GET there answers: $probe. Linking answered: $(echo "$pair" | jq -c '{box, send}')"
          fi
          for try in 1 2 3; do
            list=$(curl -fsS -H "Authorization: Bearer $key" "$WORKER_URL/box/$box") || fail "Listing failed"
            [ "$(echo "$list" | jq -r '.items[0].name')" = "check.pdf" ] && break
            sleep 5
          done
          [ "$(echo "$list" | jq -r '.items[0].name')" = "check.pdf" ] || fail "The label wasn't listed: $list"
          id=$(echo "$list" | jq -r '.items[0].id')
          curl -fsS -H "Authorization: Bearer $key" "$WORKER_URL/box/$box/$id" -o got.pdf || fail "Fetching the label failed"
          cmp -s got.pdf "$PDF" || fail "The label came back different"
          curl -fsS -X DELETE -H "Authorization: Bearer $key" "$WORKER_URL/box/$box" > /dev/null || fail "Unlinking failed"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary @"$PDF" "$WORKER_URL/drop/$box")
          [ "$code" = "404" ] || fail "An unlinked sending address still answered $code"
          echo "::notice title=Phone mailbox check::A label went through the live Worker and back, then everything was deleted."

      # Address suggestions for everyone: works once the GEOAPIFY_KEY secret is saved in Cloudflare.
      - name: Check address suggestions
        run: |
          code=$(curl -s -o sugg.json -w '%{http_code}' -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/suggest?text=1%20Beacon%20St%2C%20Boston")
          case "$code" in
            200) echo "::notice title=Address suggestions::Working: $(jq -r '[.results[].address_line1] | join("; ")' sugg.json)" ;;
            503) echo "::notice title=Address suggestions::Not set up yet ($(jq -r .error sugg.json)). The table window uses Photon until the GEOAPIFY_KEY secret is saved." ;;
            429) echo "::notice title=Address suggestions::Used up for today; Photon fills in until tomorrow." ;;
            *) echo "::error title=Address suggestions::The Worker answered $code: $(head -c 300 sugg.json)"; exit 1 ;;
          esac

      # Accounts: off until the app's Microsoft ID is set (MS_CLIENT_ID in worker/wrangler.toml).
      - name: Check signing in
        run: |
          code=$(curl -s -o auth.json -w '%{http_code}' -X POST -H "Origin: $PANEL_ORIGIN" -H 'Content-Type: application/json' -d '{"id_token":"not.a.token"}' "$WORKER_URL/auth/microsoft")
          none=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: $PANEL_ORIGIN" -d '{}' "$WORKER_URL/sync")
          [ "$none" = "401" ] || { echo "::error title=Signing in::Syncing without a session answered $none, not 401"; exit 1; }
          case "$code" in
            503) echo "::notice title=Signing in::Not set up yet: the app's Microsoft ID isn't filled in. Syncing without a session is refused." ;;
            401) echo "::notice title=Signing in::On. A made-up sign-in is refused, and so is syncing without a session." ;;
            *) echo "::error title=Signing in::A made-up sign-in answered $code: $(head -c 300 auth.json)"; exit 1 ;;
          esac

      # How many shared lookups are used so far today (UTC). Connections are
      # stored hashed, so only their counts are shown.
      - name: Count today's address lookups
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sql="SELECT who, n FROM usage WHERE day = strftime('%Y-%m-%d','now') ORDER BY n DESC LIMIT 6"
          if ! out=$(npx --yes wrangler@4.156.2 d1 execute label-sheet-keeper --remote --json --command "$sql" 2> d1.err); then
            echo "::notice title=Address lookups today::Couldn't read the counts: $(grep -iE 'error|✘' d1.err | head -2 | tr '\n' ' ')"
            exit 0
          fi
          total=$(echo "$out" | jq -r '[.[0].results[] | select(.who == "*") | .n][0] // 0')
          top=$(echo "$out" | jq -r '[.[0].results[] | select(.who != "*") | .n | tostring] | join(", ")')
          echo "::notice title=Address lookups today::$total of 2,700 used in all. Busiest connections: ${top:-none} (each may use 300 a day)."
