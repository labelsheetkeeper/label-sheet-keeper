<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print preview – Label Sheet Keeper</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>
  window.LSK_T = Date.now();
  document.write(['lsk-tools.js', 'preview.js'].map(function (f) { return '<script src="' + f + '?t=' + LSK_T + '"><\/script>'; }).join(''));
</script>
<style>
  /* The page as it will print, on a plain backdrop. The paper stays white in dark mode, like paper. */
  :root{
    --bg:#E9EDEB; --surface:#FFFFFF; --line:#D2D9D6; --ink:#17212A; --muted:#55636E; --accent:#0D6B66;
    --edge:#7F8C99; --used-1:#EEF1F3; --used-2:#D9DEE3;
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --bg:#1E2326; --surface:#272E32; --line:#3A454B; --ink:#E4EAEC; --muted:#9AA9AF; --accent:#5BC4B9; color-scheme:dark; }
  }
  :root[data-theme="dark"]{ --bg:#1E2326; --surface:#272E32; --line:#3A454B; --ink:#E4EAEC; --muted:#9AA9AF; --accent:#5BC4B9; color-scheme:dark; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--f)}
  [hidden]{display:none!important}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:12px 16px 8px}
  h1{margin:0;font-size:15px;font-weight:700}
  .hint{margin:2px 0 0;color:var(--muted);font-size:12px}
  .key{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .key i{display:inline-block;width:18px;height:12px;vertical-align:-2px;margin-right:5px;border-radius:2px}
  .key .k-edge{border:1px dashed var(--edge);background:#fff}
  .key .k-used{background:repeating-linear-gradient(135deg,var(--used-1) 0 3px,var(--used-2) 3px 4.5px);border:1px dashed var(--edge)}
  .btn{font:600 13px var(--f);border-radius:7px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:32px}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .stage{display:flex;justify-content:center;padding:4px 16px 16px}
  .page{position:relative;container-type:inline-size;background:#fff;color:#000;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.14);overflow:hidden}
  .lab{position:absolute;overflow:hidden}
  .lab::after{content:"";position:absolute;inset:0;border:1px dashed var(--edge);border-radius:inherit;pointer-events:none}
  .lab.used{background:repeating-linear-gradient(135deg,var(--used-1) 0 6px,var(--used-2) 6px 9px)}
  .lab .t{position:absolute;inset:0}
  .lab .pic{position:absolute;inset:12%;display:flex;align-items:center;justify-content:center;border:1px solid #c9cfd5;background:#f3f5f7;color:#66727d;font:600 max(9px,1.4cqw)/1 var(--f)}
  .arrow{position:absolute;transform:translateX(-50%);white-space:nowrap;font-family:Arial,Helvetica,sans-serif;font-weight:700;color:#555;line-height:1.15}
  .lt{display:flex;flex-direction:column;overflow:hidden;white-space:normal}
  .lt-in{flex:none}
  .lt-in>div{white-space:pre-wrap;overflow-wrap:anywhere}
  .empty{margin:40px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Print preview</h1>
    <p id="sub" class="hint"></p>
  </div>
  <div class="key">
    <span><i class="k-edge"></i>Label edge</span>
    <span><i class="k-used"></i>Used</span>
    <span>Neither prints.</span>
    <button type="button" id="close" class="btn">Close</button>
  </div>
</header>
<div class="stage"><div id="page" class="page" role="img" aria-label="The page as it will print"></div></div>
<p id="empty" class="empty" hidden>Nothing to show. Open the preview again from the panel.</p>
</body>
</html>
